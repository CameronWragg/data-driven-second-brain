# The only place dev-tool versions are written (ADR-0007). scripts/install-tools.sh
# reads it in the dev container and in every CI job. Dependabot can't see it, so
# bump it by hand: change `version`, then every `sha256` (GitHub shows each
# release asset's digest).
#
# `url` is a template: {version} and {target} are filled in from this file.

[just]
version = "1.58.0"
url = "https://github.com/casey/just/releases/download/{version}/just-{version}-{target}.tar.gz"

[just.linux-x86_64]
target = "x86_64-unknown-linux-musl"
sha256 = "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"

[just.linux-aarch64]
target = "aarch64-unknown-linux-musl"
sha256 = "748237128c4c40cbdabc65e841d05ceba13cc23a91eaba395495894c1d9764df"

[just.macos-aarch64]
target = "aarch64-apple-darwin"
sha256 = "50ae3e996c974a0bf32ea7d10f495070df33f1b43e0616b2769e3d4821ed8f48"

[cargo-nextest]
version = "0.9.148"
url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{version}/cargo-nextest-{version}-{target}.tar.gz"

