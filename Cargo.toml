[package]
name = "latens"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Holds a Second Brain and serves it to Agents over MCP"
license = "MIT"
repository = "https://github.com/CameronWragg/latens"

[[bin]]
name = "latens"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml_edit = { version = "0.25.17", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
