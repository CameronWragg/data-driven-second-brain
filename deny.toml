# `cargo deny check`, run by `just check` and CI.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained and unsound included.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# An allowlist: anything not named here fails, which keeps out copyleft
# licences such as AGPL and CC-BY-SA. Add a licence only after checking it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The allowlist is policy, not a record of what the graph uses today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
